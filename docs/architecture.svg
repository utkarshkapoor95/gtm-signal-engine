<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 520">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #1a1d23; }
  .ts { font-size: 12px; fill: #5f6775; }
  .box { fill: #f6f7f9; stroke: #d1d5db; }
  .arr { stroke: #9ca3af; stroke-width: 1.5; }
  marker path { stroke: #9ca3af; }
  rect.py { fill: #f3f4f6; stroke: #9ca3af; }
  rect.bq { fill: #e6f1fb; stroke: #85b7eb; }
  rect.sql { fill: #eeedfe; stroke: #afa9ec; }
  rect.n8n { fill: #faece7; stroke: #f0997b; }
  rect.gs { fill: #eaf3de; stroke: #97c459; }
  rect.ls { fill: #e1f5ee; stroke: #5dcaa5; }
  rect.hs { fill: #faeeda; stroke: #fac775; }
  rect.tg { fill: #faeeda; stroke: #fac775; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="py" x="240" y="30" width="200" height="50" rx="8"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Python data generator</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">75 companies, 90 days</text>

<line x1="340" y1="80" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>

<rect class="bq" x="210" y="110" width="260" height="50" rx="8"/>
<text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">BigQuery</text>
<text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central">usage_events table</text>

<line x1="340" y1="160" x2="340" y2="190" class="arr" marker-end="url(#arrow)"/>

<rect class="sql" x="150" y="190" width="380" height="80" rx="8" stroke-width="1.5"/>
<text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">SQL: scored_signals view</text>
<text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central">Window functions, CTEs, composite scoring</text>
<text class="ts" x="340" y="252" text-anchor="middle" dominant-baseline="central">Rolling averages + signal detection + 0-100 score</text>

<path d="M240 270 L240 300 L140 300 L140 330" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="270" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>
<path d="M440 270 L440 300 L540 300 L540 330" fill="none" class="arr" marker-end="url(#arrow)"/>

<rect class="n8n" x="60" y="330" width="160" height="50" rx="8"/>
<text class="th" x="140" y="348" text-anchor="middle" dominant-baseline="central">n8n workflow</text>
<text class="ts" x="140" y="366" text-anchor="middle" dominant-baseline="central">Polls every 4 hours</text>

<rect class="gs" x="260" y="330" width="160" height="50" rx="8"/>
<text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">Google Sheets</text>
<text class="ts" x="340" y="366" text-anchor="middle" dominant-baseline="central">Manual export</text>

<rect class="ls" x="460" y="330" width="160" height="50" rx="8"/>
<text class="th" x="540" y="348" text-anchor="middle" dominant-baseline="central">Looker Studio</text>
<text class="ts" x="540" y="366" text-anchor="middle" dominant-baseline="central">Dashboard</text>

<line x1="420" y1="355" x2="458" y2="355" class="arr" marker-end="url(#arrow)"/>

<path d="M100 380 L100 430" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M180 380 L180 430" fill="none" class="arr" marker-end="url(#arrow)"/>

<rect class="hs" x="30" y="430" width="140" height="50" rx="8"/>
<text class="th" x="100" y="448" text-anchor="middle" dominant-baseline="central">HubSpot</text>
<text class="ts" x="100" y="466" text-anchor="middle" dominant-baseline="central">CRM upsert</text>

<rect class="tg" x="110" y="430" width="140" height="50" rx="8"/>
<text class="th" x="180" y="448" text-anchor="middle" dominant-baseline="central">Telegram</text>
<text class="ts" x="180" y="466" text-anchor="middle" dominant-baseline="central">Signal alerts</text>

</svg>
